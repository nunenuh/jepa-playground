<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 345" width="910" height="345">
  <rect x="0" y="0" width="910" height="345" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6250d6"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker>
  </defs>
  <style>
    text { fill: #0b0b0b; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1.5; }
    .learn { stroke: #2a78d6; } .frozen { stroke: #6b6a65; stroke-dasharray: 4 3; } .loss { stroke: #e0622f; }
    .bad { stroke: #e34948; } .good { stroke: #1baf7a; }
    .m { font-size: 13px; font-weight: 600; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #52514e; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .c { font-size: 11px; fill: #6b6a65; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .v { fill: #6250d6; } .r { fill: #e34948; } .g { fill: #1baf7a; } .y { fill: #b07a00; }
    .a { stroke: #52514e; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .ar { stroke: #e34948; stroke-width: 1.5; fill: none; marker-end: url(#ahr); }
    .ema { stroke: #6250d6; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ahv); }
  </style>
  <g transform="translate(6,8)">
  <rect class="box " x="4" y="40" width="160" height="70" rx="8"/>
  <text class="m" x="84.0" y="65" text-anchor="middle">12 real frames</text>
  <text class="s" x="84.0" y="82" text-anchor="middle">context</text>
  <text class="c" x="84.0" y="98" text-anchor="middle">Ped2 walkway</text>
  <rect class="box bad" x="4" y="215" width="160" height="70" rx="8"/>
  <text class="m" x="84.0" y="240" text-anchor="middle">4 next frames</text>
  <text class="s" x="84.0" y="257" text-anchor="middle">real or impossible</text>
  <text class="c" x="84.0" y="273" text-anchor="middle">4 kinds of break</text>
  <rect class="box frozen" x="200" y="40" width="160" height="70" rx="8"/>
  <text class="m" x="280.0" y="65" text-anchor="middle">V-JEPA 2 encoder</text>
  <text class="s" x="280.0" y="82" text-anchor="middle">past frames only</text>
  <text class="c" x="280.0" y="98" text-anchor="middle">frozen, 300M</text>
  <rect class="box frozen" x="200" y="215" width="160" height="70" rx="8"/>
  <text class="m" x="280.0" y="240" text-anchor="middle">V-JEPA 2 encoder</text>
  <text class="s" x="280.0" y="257" text-anchor="middle">whole 16-frame clip</text>
  <text class="c" x="280.0" y="273" text-anchor="middle">frozen, same weights</text>
  <path class="a" d="M164,75 H198"/>
  <path class="a" d="M164,250 H198"/>
  <path class="a" d="M84,110 V213"/>
  <text class="c" x="92" y="165" text-anchor="start">+ context</text>
  <rect class="box learn" x="400" y="40" width="170" height="70" rx="8"/>
  <text class="m" x="485.0" y="65" text-anchor="middle">Predictor</text>
  <text class="s" x="485.0" y="82" text-anchor="middle">zero-shot or adapted</text>
  <text class="c" x="485.0" y="98" text-anchor="middle">on normal video</text>
  <path class="a" d="M360,75 H398"/>
  <rect class="box loss" x="620" y="120" width="140" height="70" rx="8"/>
  <text class="m" x="690.0" y="145" text-anchor="middle">Surprise</text>
  <text class="s" x="690.0" y="162" text-anchor="middle">predicted vs real</text>
  <text class="c" x="690.0" y="178" text-anchor="middle">last 4 frames</text>
  <path class="a" d="M570,75 C600,75 610,110 640,118"/>
  <path class="a" d="M360,250 C560,250 610,215 640,192"/>
  <rect class="box frozen" x="620" y="245" width="140" height="70" rx="8"/>
  <text class="m" x="690.0" y="270" text-anchor="middle">Seen-before</text>
  <text class="s" x="690.0" y="287" text-anchor="middle">nearest normal</text>
  <text class="c" x="690.0" y="303" text-anchor="middle">latent, same spot</text>
  <path class="a" d="M360,262 C480,262 560,280 618,280"/>
  <text class="c" x="780" y="160" text-anchor="start">AUC per</text>
  <text class="c" x="780" y="174" text-anchor="start">anomaly type</text>
  <text class="c" x="896" y="335" text-anchor="end">every frame still looks normal: only the motion is impossible</text>
  </g>
</svg>
