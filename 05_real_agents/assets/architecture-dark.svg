<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 345" width="910" height="345">
  <rect x="0" y="0" width="910" height="345" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6a"/></marker>
  </defs>
  <style>
    text { fill: #f0efec; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #161b22; stroke: #3d444d; stroke-width: 1.5; }
    .learn { stroke: #3987e5; } .frozen { stroke: #9a9890; stroke-dasharray: 4 3; } .loss { stroke: #e0622f; }
    .bad { stroke: #ff6b6a; } .good { stroke: #3fd29b; }
    .m { font-size: 13px; font-weight: 600; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #c3c2b7; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .c { font-size: 11px; fill: #9a9890; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .v { fill: #9085e9; } .r { fill: #ff6b6a; } .g { fill: #3fd29b; } .y { fill: #f0b429; }
    .a { stroke: #c3c2b7; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .ar { stroke: #ff6b6a; stroke-width: 1.5; fill: none; marker-end: url(#ahr); }
    .ema { stroke: #9085e9; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ahv); }
  </style>
  <g transform="translate(6,8)">
  <rect class="box " x="4" y="120" width="150" height="80" rx="8"/>
  <text class="m" x="79.0" y="145" text-anchor="middle">AgentDojo runs</text>
  <text class="s" x="79.0" y="162" text-anchor="middle">29 real agents</text>
  <text class="c" x="79.0" y="178" text-anchor="middle">3 kinds of run</text>
  <rect class="box " x="180" y="120" width="150" height="80" rx="8"/>
  <text class="m" x="255.0" y="145" text-anchor="middle">Fair split</text>
  <text class="s" x="255.0" y="162" text-anchor="middle">unseen tasks</text>
  <text class="c" x="255.0" y="178" text-anchor="middle">+ unseen goals</text>
  <path class="a" d="M154,160 H178"/>
  <rect class="box frozen" x="356" y="120" width="130" height="80" rx="8"/>
  <text class="m" x="421.0" y="145" text-anchor="middle">MiniLM</text>
  <text class="s" x="421.0" y="162" text-anchor="middle">each text → 384-D</text>
  <text class="c" x="421.0" y="178" text-anchor="middle">+ argument sources</text>
  <path class="a" d="M330,160 H354"/>
  <rect class="box learn" x="512" y="120" width="150" height="80" rx="8"/>
  <text class="m" x="587.0" y="145" text-anchor="middle">JEPA</text>
  <text class="s" x="587.0" y="162" text-anchor="middle">next-token predictor</text>
  <text class="c" x="587.0" y="178" text-anchor="middle">real runs, no labels</text>
  <path class="a" d="M486,160 H510"/>
  <rect class="box good" x="700" y="120" width="200" height="80" rx="8"/>
  <text class="m" x="800.0" y="145" text-anchor="middle">Probe → run score</text>
  <text class="s" x="800.0" y="162" text-anchor="middle">linear or whole-run (Q4)</text>
  <text class="c" x="800.0" y="178" text-anchor="middle">Q1: real labels</text>
  <path class="a" d="M662,160 H698"/>
  <rect class="box frozen" x="700" y="236" width="200" height="70" rx="8"/>
  <text class="m" x="800.0" y="261" text-anchor="middle">Q2: AgentDrift labels</text>
  <text class="s" x="800.0" y="278" text-anchor="middle">synthetic, per call</text>
  <text class="c" x="800.0" y="294" text-anchor="middle">no real labels used</text>
  <path class="ema" d="M800,236 V202"/>
  <text class="c v" x="792" y="226" text-anchor="end">probe trained on</text>
  <rect class="box " x="700" y="20" width="200" height="70" rx="8"/>
  <text class="m" x="800.0" y="45" text-anchor="middle">Q3: per agent</text>
  <text class="s" x="800.0" y="62" text-anchor="middle">AUC for each model</text>
  <path class="a" d="M800,118 V92"/>
  <text class="c" x="4" y="330" text-anchor="start">hijacked vs resisted = same injected text, only the agent's actions differ</text>
  </g>
</svg>
