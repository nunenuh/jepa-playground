<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 345" width="910" height="345">
  <rect x="0" y="0" width="910" height="345" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/></marker>
    <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9085e9"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6a"/></marker>
  </defs>
  <style>
    text { fill: #f0efec; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .box { fill: #161b22; stroke: #3d444d; stroke-width: 1.5; }
    .learn { stroke: #3987e5; } .frozen { stroke: #9a9890; stroke-dasharray: 4 3; } .loss { stroke: #e0622f; }
    .bad { stroke: #ff6b6a; } .good { stroke: #3fd29b; }
    .m { font-size: 13px; font-weight: 600; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #c3c2b7; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .c { font-size: 11px; fill: #9a9890; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .v { fill: #9085e9; } .r { fill: #ff6b6a; } .g { fill: #3fd29b; } .y { fill: #f0b429; }
    .a { stroke: #c3c2b7; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .ar { stroke: #ff6b6a; stroke-width: 1.5; fill: none; marker-end: url(#ahr); }
    .ema { stroke: #9085e9; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#ahv); }
  </style>
  <g transform="translate(6,8)">
  <rect class="box " x="4" y="30" width="130" height="66" rx="8"/>
  <text class="m" x="69.0" y="55" text-anchor="middle">4 past frames</text>
  <text class="s" x="69.0" y="72" text-anchor="middle">4 × 32 × 32</text>
  <text class="c" x="69.0" y="88" text-anchor="middle">t-3 … t</text>
  <rect class="box " x="4" y="220" width="130" height="66" rx="8"/>
  <text class="m" x="69.0" y="245" text-anchor="middle">Next frame</text>
  <text class="s" x="69.0" y="262" text-anchor="middle">32 × 32</text>
  <text class="c" x="69.0" y="278" text-anchor="middle">t+1, to predict</text>
  <rect class="box learn" x="170" y="30" width="150" height="66" rx="8"/>
  <text class="m" x="245.0" y="55" text-anchor="middle">Encoder</text>
  <text class="s" x="245.0" y="72" text-anchor="middle">4 × 128</text>
  <text class="c" x="245.0" y="88" text-anchor="middle">small CNN, per frame</text>
  <rect class="box learn" x="170" y="220" width="150" height="66" rx="8"/>
  <text class="m" x="245.0" y="245" text-anchor="middle">Same encoder</text>
  <text class="s" x="245.0" y="262" text-anchor="middle">1 × 128</text>
  <text class="c" x="245.0" y="278" text-anchor="middle">shared weights</text>
  <path class="a" d="M134,63 H168"/>
  <path class="a" d="M134,253 H168"/>
  <path class="ema" d="M245,98 V218"/>
  <text class="c v" x="253" y="155" text-anchor="start">one network,</text>
  <text class="c v" x="253" y="169" text-anchor="start">used twice</text>
  <rect class="box learn" x="360" y="30" width="150" height="66" rx="8"/>
  <text class="m" x="435.0" y="55" text-anchor="middle">Predictor</text>
  <text class="s" x="435.0" y="72" text-anchor="middle">→ 128</text>
  <text class="c" x="435.0" y="88" text-anchor="middle">MLP on 4 latents</text>
  <path class="a" d="M320,63 H358"/>
  <rect class="box loss" x="560" y="125" width="150" height="66" rx="8"/>
  <text class="m" x="635.0" y="150" text-anchor="middle">Loss</text>
  <text class="s" x="635.0" y="167" text-anchor="middle">MSE + SIGReg</text>
  <text class="c" x="635.0" y="183" text-anchor="middle">training</text>
  <path class="a" d="M510,63 C545,63 560,85 600,123"/>
  <path class="a" d="M320,253 C480,253 560,230 600,193"/>
  <text class="c" x="520" y="100" text-anchor="start">predicted latent</text>
  <text class="c" x="340" y="274" text-anchor="start">real latent of t+1</text>
  <rect class="box bad" x="760" y="125" width="140" height="66" rx="8"/>
  <text class="m" x="830.0" y="150" text-anchor="middle">Surprise</text>
  <text class="s" x="830.0" y="167" text-anchor="middle">same error</text>
  <text class="c" x="830.0" y="183" text-anchor="middle">high = anomaly</text>
  <path class="a" d="M710,158 H758"/>
  <text class="c" x="734" y="180" text-anchor="middle">at test</text>
  <text class="c" x="734" y="194" text-anchor="middle">time</text>
  <text class="c" x="896" y="322" text-anchor="end">trained only on normal bouncing · teleport / reverse never shown in training</text>
  </g>
</svg>
